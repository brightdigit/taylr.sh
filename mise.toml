[tools]
node = "22.23.1"

# Put locally-installed CLIs (astro, etc.) on PATH for tasks, the way an npm
# script would. Without this, `astro` isn't found in a raw shell task.
[env]
_.path = ["./node_modules/.bin"]
# Swift-App-Template commit that `mise run vendor` checks out. Bump it here.
TEMPLATE_REF = "71dada402a0618f90d87644385f46c23cc0884bc"

# Task runner. These call the astro binary directly (no package.json scripts).
# Run with `mise run <name>`, e.g. `mise run dev`. `mise install` sets up Node;
# run `npm install` (or `mise run install`) once to fetch dependencies.
[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start the local dev server with hot reload"
run = "astro dev"

[tasks.build]
description = "Production build → dist/"
run = "astro build"

[tasks.preview]
description = "Serve the production build locally"
run = "astro preview"

[tasks.check]
description = "Type + content validation (astro check)"
run = "astro check"

# A sparse, pinned checkout of Swift-App-Template (git-ignored). Only the paths the
# docs are checked against are checked out: no _reference/, SyntaxKit/ or talk material.
[tasks.vendor]
description = "Check out the Swift-App-Template reference into vendor/"
run = """
set -e
dir=vendor/Swift-App-Template
if [ ! -d "$dir/.git" ]; then
  git clone --filter=blob:none --no-checkout https://github.com/brightdigit/Swift-App-Template.git "$dir"
fi
cd "$dir"
git sparse-checkout set --no-cone \
  '/Scripts/' '/Project.swift' '/Tuist/' '/Config/' '/Packages/' '/Resources/' '/UITests/' \
  '/.github/' '/fastlane/' '/Gemfile' '/Gemfile.lock' '/Dockerfile' '/Makefile' '/.devcontainer/' \
  '/.mise.toml' '/.swiftlint.yml' '/.swift-format' '/.codecov.yml' '/.env.example' \
  '/.gitignore' '/.gitattributes' '/*.template.md' '/.claude.template/' '/docs/decisions/'
git fetch --quiet origin "$TEMPLATE_REF"
git -c advice.detachedHead=false checkout --quiet "$TEMPLATE_REF"
"""
