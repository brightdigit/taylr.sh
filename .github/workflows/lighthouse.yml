name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node version comes from mise.toml so CI matches local development.
      - name: Set up mise (Node)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: mise run build

      # Pages and thresholds are in lighthouserc.json. The token (from the
      # Lighthouse CI GitHub App) is optional: without it there is no PR status check.
      - name: Run Lighthouse CI
        run: mise run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          include-hidden-files: true
