name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PRs build and check the site but don't deploy it.
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node version comes from mise.toml so CI matches local development.
      - name: Set up mise (Node)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Type + content check
        run: mise run check

      - name: Build site
        run: mise run build

      - name: Check internal links
        run: mise run check-links

      # --- DocC API reference injection (wired later) ---------------------
      # The DocC static archive is built in the taylr *source* repo, not here:
      #
      #   swift package generate-documentation \
      #     --disable-indexing --transform-for-static-hosting \
      #     --hosting-base-path api --output-path ./docc-out
      #
      # Once that repo publishes ./docc-out as a downloadable artifact/release,
      # uncomment the step below to fetch it and drop it into dist/api/,
      # replacing the placeholder page. Until then, the placeholder ships.
      #
      # - name: Inject DocC API reference
      #   run: |
      #     gh release download --repo brightdigit/taylr docc-latest \
      #       --pattern 'docc-out.zip' --output docc-out.zip
      #     rm -rf dist/api
      #     unzip -q docc-out.zip -d dist/api
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --------------------------------------------------------------------

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Permissions the deploy-pages action needs.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deploy finish; queue at most one more.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Concurrency doesn't guarantee order, so an older build could deploy
      # after a newer one. Skip the deploy unless this commit is still main.
      - name: Check this commit is still main
        id: current
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: ${{ github.sha }} is no longer main ($head)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
